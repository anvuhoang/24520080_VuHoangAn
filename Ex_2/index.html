<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab 2 - Exercise 2: Reactive Task Manager</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --border: #334155;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --success: #22c55e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 2rem;
    }
    header.page-header {
      max-width: 720px;
      margin: 0 auto 2rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1rem;
    }
    h1 { font-size: 1.8rem; color: var(--accent); margin-bottom: 0.25rem; }
    #app {
      max-width: 720px;
      margin: 0 auto;
    }
    .app-container {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }
    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1rem;
      margin-bottom: 1.5rem;
    }
    .app-header h2 {
      font-size: 1.4rem;
      color: #e2e8f0;
    }
    .active-indicator {
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .filter-nav {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }
    .filter-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 0.4rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.88rem;
      font-weight: 500;
      transition: all 0.2s;
    }
    .filter-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text);
    }
    .filter-btn.active {
      background: var(--accent);
      color: #0f172a;
      border-color: var(--accent);
      font-weight: 600;
    }
    .controls-section {
      margin-bottom: 1.5rem;
    }
    .primary-btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 0.6rem 1.4rem;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .primary-btn:hover {
      background: var(--primary-hover);
    }
    .task-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .task-item {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.75rem 1rem;
      display: flex;
      align-items: center;
      font-size: 0.95rem;
    }
    .task-text {
      color: var(--text);
    }
  </style>
</head>
<body>
  <header class="page-header">
    <h1>Exercise 2: Reactive Task Manager</h1>
    <p style="color: var(--text-muted); font-size: 0.95rem;">Custom useState Closure Engine &amp; Root Event Delegation</p>
  </header>
  <main id="app">
    <!-- Reactive application will be mounted here -->
  </main>
  <script type="module" src="./checkpoint2-verify.js"></script>
</body>
</html>
